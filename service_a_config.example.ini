# 示例配置：复制为 service_a_config.ini 后按部署环境填写
# （真实 service_a_config.ini 含鉴权令牌，已在 .gitignore 中排除）
#
# 生成令牌： python -c "import secrets; print(secrets.token_urlsafe(24))"

[service]
# 服务 A 监听地址（monitor 推送目标 = http://<host>:<port>/messages）
host = 127.0.0.1
port = 16320

# 收件箱目录（服务 A 自身的 JSONL，与 monitor 的 wechat_logs 解耦）
inbox_dir = service_a_inbox

# PDF 产出目录（相对 base_dir）
output_dirname = output

# 线程池 worker 数
workers = 4

# 鉴权令牌（非空时要求 monitor 请求头 X-Auth-Token 匹配；
# 须与 config.ini 的 service_a_token 一致）
auth_token =

# 渲染内核路径（历史键名 edge_path，实际语义 = 内核可执行文件路径：
# chrome-headless-shell.exe 或 msedge.exe 均可）。
# 留空 = 自动发现，顺序：此处显式配置 > 环境变量 EDGE_PATH >
# 打包目录 chrome-headless-shell\chrome-headless-shell.exe > 系统 Edge。
# 换机/打包分发无需修改；仅自动发现失败时才需要显式指定。
edge_path =

# 群名 -> 对手方映射（按实际业务群填写）
[groups]
示例群A = CP001
示例群B = CP003
