# 示例配置：复制为 config.ini 后按部署环境填写
# （真实 config.ini 含鉴权令牌，已在 .gitignore 中排除）
#
# 生成令牌： python -c "import secrets; print(secrets.token_urlsafe(24))"
# 注意：service_a_url / service_a_token 必须留在 [monitor] 节内（monitor 只从该节读取）

[monitor]
# WeChatDataAnalysis exe 监听地址（仅 remote 数据源使用；local 模式忽略）
host = 127.0.0.1
port = 10392

# 要监控的群名列表，逗号分隔，精确匹配（仅群聊，靠 isGroup 判定）
target_groups = 示例群A,示例群B

# 仅记录以该前缀开头的消息
prefix = //

# 被引用（历史）消息的标记前缀
quote_marker = #

# 启动回溯条数（换新机/首次启动时可临时设为 5~10 补采最近目标消息）
backtrack_count = 0

# 轮询间隔（秒）
poll_interval = 2

# 每次轮询拉取的最新消息条数
page_limit = 50

# 多账号时填写账号 wxid（local 模式下若与当前登录账号不一致将拒绝启动，
# 防止数据错配）；单账号可留空，自动绑定当前登录账号
account =

# 日志文件目录
output_dir = wechat_logs

# 断点续传状态文件
state_file = .monitor_state.json

# ---- 服务 A（消息处理中枢）----
# 空 = 不推送（仅本地归档）；填写后 monitor 启动即连接并推送消息文本
service_a_url = http://127.0.0.1:16320
# 服务 A 鉴权令牌（须与 service_a_config.ini 的 auth_token 一致）
service_a_token =

# ---- 数据源（内嵌 wechat_data 直连本机微信）----
# local  = 直连本机微信（检测登录账号 -> 进程内存提取密钥 -> 解密快照 -> 本地读取）
# remote = 轮询 WeChatDataAnalysis exe 的 HTTP API
# auto   = 优先 local，本机微信不可用时回退 remote
[data_source]
source = local

# 显式指定微信数据根目录（可选；留空自动发现）
data_root =

# 解密快照输出目录（可选；默认 <程序目录>/runtime/wechat_databases）
snapshot_dir =
